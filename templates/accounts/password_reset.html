{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="margin-bottom: 0.5rem; text-align: center; color: var(--primary);">Forgot Password?</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
        Enter your account email and we'll send you a single-use link to reset your password.
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_email">Email Address</label>
            <input type="email" name="email" id="id_email" class="form-input" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Send Password Reset Link</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        <a href="{% url 'accounts:login' %}">← Back to Login</a>
    </p>
</div>
{% endblock %}
