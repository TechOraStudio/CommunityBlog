{% extends 'base.html' %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div class="card" style="max-width: 550px; margin: 2rem auto; text-align: center;">
    <h2 style="color: var(--primary); margin-bottom: 1rem;">Check Your Inbox</h2>
    <p style="color: #475569; margin-bottom: 1.5rem; line-height: 1.6;">
        We have emailed you instructions for setting a new password, if an account exists with that email address. You should receive them shortly.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline">Return to Login</a>
</div>
{% endblock %}
