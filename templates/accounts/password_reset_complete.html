{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="card" style="max-width: 550px; margin: 2rem auto; text-align: center;">
    <h2 style="color: var(--success); margin-bottom: 1rem;">Password Changed Successfully</h2>
    <p style="color: #475569; margin-bottom: 1.5rem;">
        Your password has been reset. You can now log in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log In Now</a>
</div>
{% endblock %}
