{% extends 'base.html' %}

{% block title %}Delete Post{% endblock %}

{% block content %}
<div class="card" style="max-width: 550px; margin: 2rem auto; text-align: center;">
    <h2 style="color: var(--danger); margin-bottom: 1rem;">Delete Post?</h2>
    <p style="margin-bottom: 1.5rem; color: #475569;">
        Are you sure you want to permanently delete <strong>"{{ post.title }}"</strong>? This action cannot be undone.
    </p>

    <form method="post" style="display: flex; justify-content: center; gap: 1rem;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete Post</button>
        <a href="{% url 'posts:post_detail' post.slug %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
